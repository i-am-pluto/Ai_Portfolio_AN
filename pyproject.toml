[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.2.0"
description = "MCP server for Indian stock analysis — fundamentals, corporate actions & news"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "uvicorn>=0.24.0",
    "yfinance>=0.2.36",
    "nselib>=2.0",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-groq>=1.0.0",
    "langchain-openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stocks_fetch*"]

[tool.setuptools.package-data]
"stocks_fetch.agent" = ["prompts/*.md"]

[project.scripts]
stock-analyzer = "stocks_fetch.server:main"
portfolio-report = "stocks_fetch.agent.runner:run_portfolio_analysis"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython",
    "uvicorn>=0.24.0",
]
