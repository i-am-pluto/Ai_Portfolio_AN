[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-stock-analyzer"
version = "0.2.0"
description = "MCP server for Indian stock analysis — fundamentals, corporate actions & news"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "yfinance>=0.2.36",
    "nselib>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["stocks_fetch*"]

[project.scripts]
stock-analyzer = "stocks_fetch.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython",
    "uvicorn>=0.24.0",
]
