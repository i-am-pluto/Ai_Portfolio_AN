// ─── Utilities ───────────────────────────────────────────────────────────────
function useCountdown() {
  const [timeLeft, setTimeLeft] = useState({});
  useEffect(() => {
    const calc = () => {
      const now = new Date();
      const diff = RACE_DATE - now;
      if (diff <= 0) return setTimeLeft({ d: 0, h: 0, m: 0, s: 0 });
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      setTimeLeft({ d, h, m, s });
    };
    calc();
    const id = setInterval(calc, 1000);
    return () => clearInterval(id);
  }, []);
  return timeLeft;
}

function ProgressRing({ pct, size = 60, stroke = 5, color = '#e63946' }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="rotate-[-90deg]">
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#222" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
        strokeWidth={stroke} strokeDasharray={circ}
        strokeDashoffset={offset} strokeLinecap="round"
        className="progress-ring" />
    </svg>
  );
}

// ─── JSONBlob Database ───────────────────────────────────────────────────────
const REGISTRY_ID = '019cd151-cd55-748c-b371-766685b82eff';
const REGISTRY_URL = `https://jsonblob.com/api/jsonBlob/${REGISTRY_ID}`;
const SESSION_KEY = 'dc_current_user';

async function fetchWithRetry(url, options = {}, retries = 3, timeoutMs = 10000) {
  for (let i = 0; i <= retries; i++) {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(tid);
      return res;
    } catch (e) {
      clearTimeout(tid);
      if (i === retries) throw e;
      await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
    }
  }
}

async function getRegistry() {
  try {
    const res = await fetchWithRetry(REGISTRY_URL);
    if (res.ok) return await res.json();
  } catch (_) {}
  return { users: {} };
}

async function updateRegistry(registry) {
  await fetchWithRetry(REGISTRY_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(registry)
  });
}

async function createBlob(data) {
  const res = await fetchWithRetry('https://jsonblob.com/api/jsonBlob', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(data)
  });
  const loc = res.headers.get('location') || '';
  return loc.split('/').pop();
}

async function loadBlob(id) {
  try {
    const res = await fetchWithRetry(`https://jsonblob.com/api/jsonBlob/${id}`);
    if (res.ok) return await res.json();
  } catch (_) {}
  return null;
}

async function saveBlob(id, data) {
  if (!id) return;
  await fetchWithRetry(`https://jsonblob.com/api/jsonBlob/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(data)
  });
}

// Login: look up or create user entry in registry
async function loginUser(username) {
  const key = username.trim().toLowerCase();
  const registry = await getRegistry();
  let blobId = registry.users?.[key];
  const init = makeInitialState();

  if (!blobId) {
    blobId = await createBlob({ ...init, username: key, createdAt: Date.now() });
    if (!blobId) throw new Error('Failed to create user blob');
    const updated = { ...registry, users: { ...(registry.users || {}), [key]: blobId } };
    await updateRegistry(updated);
    return { blobId, data: init, isNew: true };
  }

  const existing = await loadBlob(blobId);
  if (!existing) return { blobId, data: init, isNew: false };
  const merged = { ...init, ...existing, progress: { ...init.progress, ...existing.progress }, gear: { ...init.gear, ...existing.gear } };
  return { blobId, data: merged, isNew: false };
}

// ─── Leaderboard Data ────────────────────────────────────────────────────────
const TOTAL_EXERCISES = PLAN.reduce((sum, d) => sum + d.exercises.length, 0);

function calcUserProgress(data) {
  if (!data) return { totalDone: 0, totalEx: TOTAL_EXERCISES, pct: 0, dayPcts: {} };
  let totalDone = 0;
  const dayPcts = {};
  PLAN.forEach(d => {
    const p = data.progress?.[`day${d.day}`] || {};
    const done = Object.values(p.checked || {}).filter(Boolean).length;
    totalDone += done;
    dayPcts[d.day] = d.exercises.length > 0 ? Math.round((done / d.exercises.length) * 100) : 0;
  });
  const pct = Math.round((totalDone / TOTAL_EXERCISES) * 100);
  return { totalDone, totalEx: TOTAL_EXERCISES, pct, dayPcts };
}

async function fetchLeaderboard() {
  const registry = await getRegistry();
  const users = registry.users || {};
  const entries = await Promise.all(
    Object.entries(users).map(async ([username, blobId]) => {
      const data = await loadBlob(blobId);
      const stats = calcUserProgress(data);
      return { username, blobId, ...stats, lastSeen: data?.lastSeen || data?.createdAt || null };
    })
  );
  return entries.sort((a, b) => b.pct - a.pct || b.totalDone - a.totalDone);
}

// ─── Initial State ────────────────────────────────────────────────────────────
function makeInitialState() {
  const progress = {};
  PLAN.forEach(d => { progress[`day${d.day}`] = { checked: {}, note: '' }; });
  const gear = {};
  GEAR.forEach(g => { gear[g.id] = false; });
  return { progress, gear, startedAt: Date.now() };
}

            <span className="flex-shrink-0 w-6 h-6 bg-black/20 rounded-full flex items-center justify-center text-xs font-bold">{i+1}</span>
            <span>{item}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

function OverallProgress({ progress }) {
  let totalEx = 0, totalDone = 0;
  PLAN.forEach(d => {
    totalEx += d.exercises.length;
    const p = progress[`day${d.day}`] || {};
    totalDone += Object.values(p.checked || {}).filter(Boolean).length;
  });
  const pct = totalEx > 0 ? Math.round((totalDone / totalEx) * 100) : 0;
  return (
    <div className="flex items-center gap-4 bg-white/3 border border-gray-800 rounded-2xl px-5 py-4">
      <ProgressRing pct={pct} size={56} stroke={5} color="#e63946" />
      <div>
        <div className="text-xs text-gray-500 uppercase tracking-wider">Overall Progress</div>
        <div className="bebas text-2xl text-white mt-0.5">{totalDone} / {totalEx} Exercises Done</div>
      </div>
    </div>
  );
}

// ─── Leaderboard Screen ───────────────────────────────────────────────────────
const RANK_MEDALS = ['🥇', '🥈', '🥉'];

function LeaderboardRow({ entry, rank, isCurrentUser }) {
  const medal = RANK_MEDALS[rank] || null;
  const barColor = entry.pct === 100 ? '#4ade80' : entry.pct > 50 ? '#ff6b35' : '#e63946';

  return (
    <div className={`lb-row flex items-center gap-3 px-4 py-3 rounded-xl border transition-all ${isCurrentUser ? 'border-red-700/60 bg-red-950/30' : 'border-gray-800/60 bg-white/2'}`}>
      {/* Rank */}
      <div className="w-7 text-center flex-shrink-0">
        {medal
          ? <span className="text-xl">{medal}</span>
          : <span className="text-sm text-gray-500 font-bold">#{rank + 1}</span>
        }
      </div>

      {/* Name + bar */}
      <div className="flex-1 min-w-0">
        <div className="flex items-center gap-2 mb-1.5">
          <span className={`text-sm font-bold capitalize truncate ${isCurrentUser ? 'text-red-400' : 'text-white'}`}>
            {entry.username}
          </span>
          {isCurrentUser && <span className="text-xs bg-red-900/50 text-red-400 border border-red-800/50 px-1.5 py-0.5 rounded-full flex-shrink-0">you</span>}
          {entry.pct === 100 && <span className="text-xs">🔥</span>}
        </div>
        {/* Progress bar */}
        <div className="w-full bg-gray-800 rounded-full h-1.5">
          <div className="h-1.5 rounded-full transition-all duration-700"
            style={{ width: `${entry.pct}%`, background: barColor }} />
        </div>
      </div>

      {/* Stats */}
      <div className="text-right flex-shrink-0">
        <div className="text-sm font-bold" style={{ color: barColor }}>{entry.pct}%</div>
        <div className="text-xs text-gray-600">{entry.totalDone}/{entry.totalEx}</div>
      </div>
    </div>
  );
}

function LeaderboardScreen({ currentUser, onBack }) {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState('');
  const [lastRefresh, setLastRefresh] = useState(null);

  const load = async () => {
    setLoading(true);
    setErr('');
    try {
      const data = await fetchLeaderboard();
      setEntries(data);
      setLastRefresh(new Date());
    } catch (_) {
      setErr('Could not load leaderboard — check your connection and retry.');
    }
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const topPct = entries.length > 0 ? entries[0].pct : 0;
  const myRank = entries.findIndex(e => e.username === currentUser);

  return (
    <div className="min-h-screen max-w-2xl mx-auto px-4 py-6 slide-in">
      {/* Header */}
      <div className="flex items-center gap-3 mb-6">
        <button onClick={onBack}
          className="flex items-center gap-1.5 text-sm text-gray-400 hover:text-white border border-gray-800 hover:border-gray-600 rounded-full px-3 py-1.5 transition-colors">
          ← Back
        </button>
        <div className="flex-1 text-center">
          <h1 className="bebas text-3xl text-white">Squad Leaderboard</h1>
          <p className="text-xs text-gray-600">Devil Circuit Delhi · Mar 15, 2026</p>
        </div>
        <button onClick={load} disabled={loading}
          className="text-sm text-gray-400 hover:text-white border border-gray-800 hover:border-gray-600 rounded-full px-3 py-1.5 transition-colors disabled:opacity-40">
          {loading ? '⟳' : '↻ Refresh'}
        </button>
      </div>

      {/* Top summary bar */}
      {!loading && entries.length > 0 && (
        <div className="grid grid-cols-3 gap-3 mb-6">
          <div className="bg-white/3 border border-gray-800 rounded-2xl p-4 text-center">
            <div className="bebas text-3xl text-white">{entries.length}</div>
            <div className="text-xs text-gray-500 uppercase tracking-wider mt-0.5">Athletes</div>
          </div>
          <div className="bg-white/3 border border-gray-800 rounded-2xl p-4 text-center">
            <div className="bebas text-3xl" style={{color:'#ff6b35'}}>{topPct}%</div>
            <div className="text-xs text-gray-500 uppercase tracking-wider mt-0.5">Top Score</div>
          </div>
          <div className="bg-white/3 border border-gray-800 rounded-2xl p-4 text-center">
            {myRank >= 0
              ? <><div className="bebas text-3xl" style={{color:'#e63946'}}>#{myRank + 1}</div>
                  <div className="text-xs text-gray-500 uppercase tracking-wider mt-0.5">Your Rank</div></>
              : <><div className="bebas text-3xl text-gray-600">—</div>
                  <div className="text-xs text-gray-500 uppercase tracking-wider mt-0.5">Your Rank</div></>
            }
          </div>
        </div>
      )}

      {/* Loading skeletons */}
      {loading && (
        <div className="space-y-3">
          {[...Array(5)].map((_, i) => (
            <div key={i} className="skeleton h-14 rounded-xl" />
          ))}
        </div>
      )}

      {/* Error */}
      {!loading && err && (
        <div className="text-center py-12">
          <div className="text-4xl mb-3">📡</div>
          <p className="text-red-400 text-sm mb-4">{err}</p>
          <button onClick={load} className="text-sm font-semibold px-4 py-2 rounded-xl text-white" style={{background:'linear-gradient(135deg,#e63946,#ff6b35)'}}>
            Try Again
          </button>
        </div>
      )}

      {/* Empty */}
      {!loading && !err && entries.length === 0 && (
        <div className="text-center py-12 text-gray-600 text-sm">
          No athletes yet — be the first!
        </div>
      )}

      {/* Leaderboard list */}
      {!loading && !err && entries.length > 0 && (
        <div className="space-y-2">
          {entries.map((entry, i) => (
            <LeaderboardRow
              key={entry.username}
              entry={entry}
              rank={i}
              isCurrentUser={currentUser && entry.username === currentUser}
            />
          ))}
        </div>
      )}

      {/* Last refresh */}
      {lastRefresh && !loading && (
        <p className="text-center text-xs text-gray-700 mt-4">
          Updated {lastRefresh.toLocaleTimeString()}
        </p>
      )}

      {/* Per-day breakdown legend */}
      {!loading && !err && entries.length > 0 && (
        <div className="mt-6 bg-white/2 border border-gray-800 rounded-2xl p-4">
          <div className="text-xs text-gray-500 uppercase tracking-wider mb-3">Per-Day Breakdown — Top Athletes</div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr>
                  <th className="text-left text-gray-600 pb-2 pr-3 font-medium">Athlete</th>
                  {PLAN.map(p => (
                    <th key={p.day} className="text-center text-gray-600 pb-2 px-1 font-medium">{p.emoji}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {entries.slice(0, 10).map(entry => (
                  <tr key={entry.username} className={entry.username === currentUser ? 'text-red-400' : 'text-gray-400'}>
                    <td className="pr-3 py-1.5 font-semibold capitalize truncate max-w-[80px]">{entry.username}</td>
                    {PLAN.map(p => {
                      const pct = entry.dayPcts?.[p.day] || 0;
                      const color = pct === 100 ? '#4ade80' : pct > 0 ? '#ff6b35' : '#374151';
                      return (
                        <td key={p.day} className="text-center px-1 py-1.5">
                          <div className="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold"
                            style={{ background: color + '25', color }}>
                            {pct === 100 ? '✓' : pct > 0 ? '~' : '·'}
                          </div>
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex items-center gap-4 mt-3 text-xs text-gray-600">
            <span><span className="text-green-400 font-bold">✓</span> Complete</span>
            <span><span className="text-orange-400 font-bold">~</span> In progress</span>
            <span><span className="text-gray-600 font-bold">·</span> Not started</span>
          </div>
        </div>
      )}

      <div className="pb-8" />
    </div>
  );
}

// ─── Login Screen ─────────────────────────────────────────────────────────────
function LoginScreen({ onLogin, onLeaderboard }) {
  const [name, setName] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const handle = async (e) => {
    e.preventDefault();
    const trimmed = name.trim();
    if (!trimmed) return setErr('Enter your name or a squad ID');
    if (!/^[a-zA-Z0-9_\- ]{2,24}$/.test(trimmed)) return setErr('2–24 chars, letters/numbers/spaces only');
    setErr('');
    setLoading(true);
    try {
      const result = await loginUser(trimmed);
      sessionStorage.setItem(SESSION_KEY, trimmed.toLowerCase());
      onLogin(trimmed.toLowerCase(), result);
    } catch (e) {
      if (e.name === 'AbortError' || e.message?.includes('abort')) {
        setErr('Request timed out — check your internet & retry');
      } else {
        setErr('Connection error — check internet & retry');
      }
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="w-full max-w-sm slide-in">
        {/* Logo */}
        <div className="text-center mb-8">
          <div className="text-5xl mb-3 flame">🔥</div>
          <h1 className="bebas text-5xl text-white tracking-wide">Devil <span style={{color:'#e63946'}}>Circuit</span></h1>
          <p className="text-gray-500 text-sm mt-2">Delhi · Mar 15, 2026</p>
        </div>

        {/* Card */}
        <div className="bg-white/3 border border-gray-800 rounded-2xl p-6">
          <h2 className="text-white font-bold text-lg mb-1">Jump In</h2>
          <p className="text-gray-500 text-sm mb-5">Enter your name or pick a squad ID — your progress saves automatically across devices.</p>

          <form onSubmit={handle} className="space-y-4">
            <div>
              <input
                type="text" value={name} onChange={e => setName(e.target.value)}
                placeholder="e.g. Arjun, runner42, TeamRed…"
                className="w-full bg-white/5 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 outline-none focus:border-red-600 transition-colors text-sm"
                autoFocus disabled={loading}
              />
              {err && <p className="text-red-400 text-xs mt-2">{err}</p>}
            </div>
            <button type="submit" disabled={loading}
              className="w-full py-3 rounded-xl font-bold text-white text-sm transition-all disabled:opacity-50"
              style={{background: loading ? '#555' : 'linear-gradient(135deg,#e63946,#ff6b35)'}}>
              {loading ? '⟳ Connecting...' : 'Start Training →'}
            </button>
          </form>

          <p className="text-gray-700 text-xs text-center mt-4">No password needed · Your ID is your key</p>
        </div>

        {/* Leaderboard peek */}
        <button onClick={onLeaderboard}
          className="w-full mt-4 py-3 rounded-xl font-semibold text-sm text-gray-400 hover:text-white border border-gray-800 hover:border-gray-600 transition-colors flex items-center justify-center gap-2">
          🏆 View Squad Leaderboard
        </button>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [activeDay, setActiveDay] = useState(1);
  const [user, setUser] = useState(null);
  const [dbState, setDbState] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState('');
  const [view, setView] = useState('login'); // 'login' | 'dashboard' | 'leaderboard'
  const saveTimer = useRef(null);
  const timeLeft = useCountdown();

  // Check for existing session on mount
  useEffect(() => {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      setUser(saved);
      setView('loading');
      loginUser(saved).then(result => {
        setDbState({ id: result.blobId, data: result.data });
        setView('dashboard');
      }).catch(() => {
        sessionStorage.removeItem(SESSION_KEY);
        setUser(null);
        setView('login');
      });
    }
  }, []);

  const handleLogin = (username, result) => {
    setUser(username);
    setDbState({ id: result.blobId, data: result.data });
    setView('dashboard');
  };

  const handleLogout = () => {
    sessionStorage.removeItem(SESSION_KEY);
    setUser(null);
    setDbState(null);
    setView('login');
  };

  const scheduleSave = useCallback((newData, id) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSyncing(true);
      try {
        await saveBlob(id, { ...newData, lastSeen: Date.now() });
        setSyncMsg('Saved ✓');
      } catch (_) {
        setSyncMsg('Offline');
      }
      setSyncing(false);
      setTimeout(() => setSyncMsg(''), 2000);
    }, 800);
  }, []);

  const updateData = useCallback((updater) => {
    setDbState(prev => {
      if (!prev) return prev;
      const newData = updater(prev.data);
      scheduleSave(newData, prev.id);
      return { ...prev, data: newData };
    });
  }, [scheduleSave]);

  const toggleExercise = useCallback((dayNum, exId) => {
    updateData(data => ({
      ...data,
      progress: {
        ...data.progress,
        [`day${dayNum}`]: {
          ...data.progress[`day${dayNum}`],
          checked: {
            ...data.progress[`day${dayNum}`]?.checked,
            [exId]: !data.progress[`day${dayNum}`]?.checked?.[exId]
          }
        }
      }
    }));
  }, [updateData]);

  const updateNote = useCallback((dayNum, note) => {
    updateData(data => ({
      ...data,
      progress: { ...data.progress, [`day${dayNum}`]: { ...data.progress[`day${dayNum}`], note } }
    }));
  }, [updateData]);

  const toggleGear = useCallback((gid) => {
    updateData(data => ({ ...data, gear: { ...data.gear, [gid]: !data.gear[gid] } }));
  }, [updateData]);

  // Loading state
  if (view === 'loading') {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-4xl mb-4 flame">🔥</div>
          <div className="text-gray-400 text-sm">Loading {user}'s battle plan...</div>
        </div>
      </div>
    );
  }

  // Login
  if (view === 'login') {
    return <LoginScreen onLogin={handleLogin} onLeaderboard={() => setView('leaderboard')} />;
  }

  // Leaderboard (accessible both logged in and out)
  if (view === 'leaderboard') {
    return <LeaderboardScreen currentUser={user} onBack={() => setView(user && dbState ? 'dashboard' : 'login')} />;
  }

  // Dashboard guard
  if (!dbState) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-4xl mb-4 flame">🔥</div>
          <div className="text-gray-400 text-sm">Loading...</div>
        </div>
      </div>
    );
  }

  const { data } = dbState;
  const currentPlan = PLAN.find(p => p.day === activeDay);

  const dayPcts = {};
  PLAN.forEach(p => {
    const prog = data.progress[`day${p.day}`] || {};
    const done = Object.values(prog.checked || {}).filter(Boolean).length;
    dayPcts[p.day] = p.exercises.length > 0 ? Math.round((done / p.exercises.length) * 100) : 0;
  });

  const raceToday = new Date() >= RACE_DATE;

  return (
    <div className="min-h-screen max-w-2xl mx-auto px-4 py-6">

      {/* Header */}
      <div className="text-center mb-6">
        {/* User bar */}
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2 bg-white/5 border border-gray-800 rounded-full px-3 py-1.5">
            <span className="w-2 h-2 bg-green-500 rounded-full inline-block"></span>
            <span className="text-xs text-gray-300 font-semibold capitalize">{user}</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setView('leaderboard')}
              className="text-xs text-gray-400 hover:text-white border border-gray-800 hover:border-gray-600 rounded-full px-3 py-1.5 transition-colors flex items-center gap-1">
              🏆 Leaderboard
            </button>
            <button onClick={handleLogout}
              className="text-xs text-gray-600 hover:text-gray-300 border border-gray-800 hover:border-gray-600 rounded-full px-3 py-1.5 transition-colors">
              Switch ↗
            </button>
          </div>
        </div>

        <div className="inline-flex items-center gap-2 bg-red-950/50 border border-red-900/50 rounded-full px-4 py-1.5 mb-3">
          <span className="w-2 h-2 bg-red-500 rounded-full pulse-red inline-block"></span>
          <span className="text-xs text-red-400 uppercase tracking-widest font-semibold">Delhi — Mar 15, 2026</span>
        </div>
        <h1 className="bebas text-5xl sm:text-6xl leading-none text-white tracking-wide">
          Devil <span style={{color:'#e63946'}}>Circuit</span>
        </h1>
        <p className="text-gray-500 text-sm mt-2 tracking-wider">6-Day Battle Plan · Conquer Every Obstacle</p>
      </div>

      {/* Countdown */}
      {!raceToday ? (
        <div className="bg-white/3 border border-gray-800 rounded-2xl p-5 mb-6">
          <div className="text-xs text-gray-600 uppercase tracking-widest text-center mb-3">Time Until Race</div>
          <div className="flex items-center justify-center gap-6">
            <CountdownUnit val={timeLeft.d} label="days" />
            <span className="text-gray-700 text-2xl bebas">:</span>
            <CountdownUnit val={timeLeft.h} label="hrs" />
            <span className="text-gray-700 text-2xl bebas">:</span>
            <CountdownUnit val={timeLeft.m} label="min" />
            <span className="text-gray-700 text-2xl bebas">:</span>
            <CountdownUnit val={timeLeft.s} label="sec" />
          </div>
        </div>
      ) : (
        <div className="race-day-card rounded-2xl p-5 mb-6 text-center">
          <div className="bebas text-4xl">🔥 RACE DAY! GO CRUSH IT! 🔥</div>
        </div>
      )}

      {/* Overall progress */}
      <div className="mb-6">
        <OverallProgress progress={data.progress} />
      </div>

      {/* Day tabs */}
      <div className="grid grid-cols-6 gap-2 mb-6">
        {PLAN.map(p => (
          <DayTab key={p.day} plan={p} active={activeDay === p.day}
            completed={dayPcts[p.day]}
            onClick={() => setActiveDay(p.day)} />
        ))}
      </div>

      {/* Day card */}
      <div key={activeDay} className="bg-white/3 border border-gray-800 rounded-2xl p-5 mb-2">
        <DayCard
          plan={currentPlan}
          dayProgress={data.progress[`day${activeDay}`] || { checked: {}, note: '' }}
          onToggle={(exId) => toggleExercise(activeDay, exId)}
          onNote={(note) => updateNote(activeDay, note)}
        />
      </div>

      {/* Sync indicator */}
      <div className="text-right text-xs mb-6 h-4">
        {syncing && <span className="text-yellow-500">⟳ Syncing...</span>}
        {syncMsg && !syncing && <span className="text-green-500">{syncMsg}</span>}
        {dbState.id && !syncing && !syncMsg && (
          <span className="text-gray-700">☁ Cloud synced · ID: {dbState.id.slice(0,8)}...</span>
        )}
      </div>

      {/* Gear checklist */}
      <GearChecklist gear={data.gear} onToggle={toggleGear} />

      {/* Race morning protocol */}
      <RaceMorningCard />

      {/* Footer */}
      <div className="text-center mt-8 pb-4 text-gray-700 text-xs">
        <p>Progress saved to JSONBlob cloud · Auto-synced across devices</p>
        <p className="mt-1 bebas text-sm text-gray-600">Devil Circuit Delhi 2026 · Train Hard, Run Harder 🔥</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
