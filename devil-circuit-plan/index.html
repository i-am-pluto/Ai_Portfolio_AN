// ─── Utilities ───────────────────────────────────────────────────────────────
function useCountdown() {
  const [timeLeft, setTimeLeft] = useState({});
  useEffect(() => {
    const calc = () => {
      const now = new Date();
      const diff = RACE_DATE - now;
      if (diff <= 0) return setTimeLeft({ d: 0, h: 0, m: 0, s: 0 });
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      setTimeLeft({ d, h, m, s });
    };
    calc();
    const id = setInterval(calc, 1000);
    return () => clearInterval(id);
  }, []);
  return timeLeft;
}

function ProgressRing({ pct, size = 60, stroke = 5, color = '#e63946' }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ - (pct / 100) * circ;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="rotate-[-90deg]">
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#222" strokeWidth={stroke} />
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color}
        strokeWidth={stroke} strokeDasharray={circ}
        strokeDashoffset={offset} strokeLinecap="round"
        className="progress-ring" />
    </svg>
  );
}

// ─── JSONBlob Database (with localStorage fallback) ──────────────────────────
const REGISTRY_ID = '019cd151-cd55-748c-b371-766685b82eff';
const REGISTRY_URL = `https://jsonblob.com/api/jsonBlob/${REGISTRY_ID}`;
const SESSION_KEY = 'dc_current_user';
const LS_REGISTRY_KEY = 'dc_registry';
const LS_BLOB_PREFIX = 'dc_blob_';

// localStorage helpers
function lsGetRegistry() {
  try { return JSON.parse(localStorage.getItem(LS_REGISTRY_KEY) || '{"users":{}}'); } catch(_) { return { users: {} }; }
}
function lsSetRegistry(r) {
  try { localStorage.setItem(LS_REGISTRY_KEY, JSON.stringify(r)); } catch(_) {}
}
function lsGetBlob(id) {
  try { return JSON.parse(localStorage.getItem(LS_BLOB_PREFIX + id) || 'null'); } catch(_) { return null; }
}
function lsSetBlob(id, data) {
  try { localStorage.setItem(LS_BLOB_PREFIX + id, JSON.stringify(data)); } catch(_) {}
}

async function fetchWithRetry(url, options = {}, retries = 1, timeoutMs = 6000) {
  for (let i = 0; i <= retries; i++) {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const res = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(tid);
      return res;
    } catch (e) {
      clearTimeout(tid);
      if (i === retries) throw e;
      await new Promise(r => setTimeout(r, 800));
    }
  }
}

async function getRegistry() {
  try {
    const res = await fetchWithRetry(REGISTRY_URL);
    if (res.ok) {
      const remote = await res.json();
      // merge remote into local so we keep any local-only users
      const local = lsGetRegistry();
      const merged = { users: { ...local.users, ...remote.users } };
      lsSetRegistry(merged);
      return merged;
    }
  } catch (_) {}
  return lsGetRegistry();
}

async function updateRegistry(registry) {
  lsSetRegistry(registry);
  try {
    await fetchWithRetry(REGISTRY_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(registry)
    });
  } catch (_) {} // local save already done; cloud sync best-effort
}

async function createBlob(data) {
  try {
    const res = await fetchWithRetry('https://jsonblob.com/api/jsonBlob', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data)
    });
    const loc = res.headers.get('location') || '';
    const id = loc.split('/').pop();
    if (id) { lsSetBlob(id, data); return id; }
  } catch (_) {}
  // fallback: local-only ID
  const localId = 'local_' + (data.username || Date.now());
  lsSetBlob(localId, data);
  return localId;
}

async function loadBlob(id) {
  if (!id) return null;
  if (!id.startsWith('local_')) {
    try {
      const res = await fetchWithRetry(`https://jsonblob.com/api/jsonBlob/${id}`);
      if (res.ok) {
        const data = await res.json();
        lsSetBlob(id, data); // keep local cache fresh
        return data;
      }
    } catch (_) {}
  }
  return lsGetBlob(id);
}

async function saveBlob(id, data) {
  if (!id) return;
  lsSetBlob(id, data);
  if (!id.startsWith('local_')) {
    try {
      await fetchWithRetry(`https://jsonblob.com/api/jsonBlob/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(data)
      });
    } catch (_) {} // local save already done
  }
}

// Login: look up or create user — always succeeds (falls back to localStorage)
async function loginUser(username) {
  const key = username.trim().toLowerCase();
  const registry = await getRegistry();
  let blobId = registry.users?.[key];
  const init = makeInitialState();

  if (!blobId) {
    blobId = await createBlob({ ...init, username: key, createdAt: Date.now() });
    const updated = { ...registry, users: { ...(registry.users || {}), [key]: blobId } };
    await updateRegistry(updated);
    return { blobId, data: init, isNew: true };
  }

  const existing = await loadBlob(blobId);
  if (!existing) return { blobId, data: init, isNew: false };
  const mergedGym = existing.gymWorkout
    ? {
        days: { ...init.gymWorkout.days, ...existing.gymWorkout.days },
        dayNames: { ...init.gymWorkout.dayNames, ...(existing.gymWorkout.dayNames || {}) },
        calendar: { ...(existing.gymWorkout.calendar || {}) },
      }
    : init.gymWorkout;
  const merged = { ...init, ...existing, progress: { ...init.progress, ...existing.progress }, gear: { ...init.gear, ...existing.gear }, gymWorkout: mergedGym };
  return { blobId, data: merged, isNew: false };
}

// ─── Leaderboard Data ────────────────────────────────────────────────────────
const TOTAL_EXERCISES = PLAN.reduce((sum, d) => sum + d.exercises.length, 0);

function calcUserProgress(data) {
  if (!data) return { totalDone: 0, totalEx: TOTAL_EXERCISES, pct: 0, dayPcts: {} };
  let totalDone = 0;
  const dayPcts = {};
  PLAN.forEach(d => {
    const p = data.progress?.[`day${d.day}`] || {};
    const done = Object.values(p.checked || {}).filter(Boolean).length;
    totalDone += done;
    dayPcts[d.day] = d.exercises.length > 0 ? Math.round((done / d.exercises.length) * 100) : 0;
  });
  const pct = Math.round((totalDone / TOTAL_EXERCISES) * 100);
  return { totalDone, totalEx: TOTAL_EXERCISES, pct, dayPcts };
}

  const users = registry.users || {};
  const entries = await Promise.all(
    Object.entries(users).map(async ([username, blobId]) => {
      const data = await loadBlob(blobId);
      const stats = calcUserProgress(data);
      return { username, blobId, ...stats, lastSeen: data?.lastSeen || data?.createdAt || null };
    })
  );
  return entries.sort((a, b) => b.pct - a.pct || b.totalDone - a.totalDone);
}

  const progress = {};

}

// ─── Workout Calendar Component ────────────────────────────────────────────────
function WorkoutCalendar({ calendar, onToggleDate, gymWorkout }) {
  const [viewMonth, setViewMonth] = useState(() => {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  });

  const daysInMonth = new Date(viewMonth.year, viewMonth.month + 1, 0).getDate();
  const firstDayOfWeek = new Date(viewMonth.year, viewMonth.month, 1).getDay();
  const monthName = new Date(viewMonth.year, viewMonth.month).toLocaleString('default', { month: 'long', year: 'numeric' });
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  const prevMonth = () => setViewMonth(v => v.month === 0 ? { year: v.year - 1, month: 11 } : { ...v, month: v.month - 1 });
  const nextMonth = () => setViewMonth(v => v.month === 11 ? { year: v.year + 1, month: 0 } : { ...v, month: v.month + 1 });

  const calData = calendar || {};
  const dayNames = gymWorkout.dayNames || {};

  // Count workouts this month
  const monthWorkouts = Object.keys(calData).filter(d => {
    const [y, m] = d.split('-').map(Number);
    return y === viewMonth.year && m === viewMonth.month + 1 && calData[d];
  }).length;

  // Current streak
  let streak = 0;
  const checkDate = new Date(today);
  while (true) {
    const ds = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
    if (calData[ds]) { streak++; checkDate.setDate(checkDate.getDate() - 1); }
    else break;
  }

  const cells = [];
  // Empty cells for days before the 1st
  for (let i = 0; i < firstDayOfWeek; i++) cells.push(<div key={`e${i}`} />);
  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${viewMonth.year}-${String(viewMonth.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isToday = dateStr === todayStr;
    const entry = calData[dateStr];
    const worked = !!entry;
    const gymDayId = entry?.gymDayId;
    const gymPlan = gymDayId ? DEFAULT_GYM_PLAN.find(g => g.id === gymDayId) : null;
    const customName = gymDayId && dayNames[gymDayId] ? dayNames[gymDayId] : null;

    cells.push(
      <button key={d} onClick={() => onToggleDate(dateStr)}
        title={worked ? (customName || gymPlan?.label || 'Workout done') : 'Mark as workout day'}
        className={`relative aspect-square rounded-lg text-xs font-semibold transition-all flex flex-col items-center justify-center gap-0.5 ${
          worked
            ? 'bg-green-900/40 border border-green-700/50 text-green-300'
            : isToday
              ? 'bg-red-950/40 border border-red-700/40 text-white'
              : 'bg-white/2 border border-gray-800/50 text-gray-500 hover:bg-white/5 hover:border-gray-600'
        }`}>
        <span className={isToday ? 'font-bold' : ''}>{d}</span>
        {worked && <span className="text-xs leading-none">{gymPlan?.emoji || '✅'}</span>}
      </button>
    );
  }

  return (
    <div className="bg-white/3 border border-gray-800 rounded-2xl p-5 mb-5">
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <div>
          <h3 className="bebas text-2xl text-white leading-none">Workout Calendar</h3>
          <p className="text-xs text-gray-500 mt-1">Tap a date to log your workout</p>
        </div>
        <div className="flex items-center gap-3">
          <div className="text-right">
            <div className="text-xs text-gray-500">Streak</div>
            <div className="bebas text-lg text-orange-400 leading-none">{streak}d 🔥</div>
          </div>
          <div className="text-right">

function GeneralWorkoutSection({ gymWorkout, onUpdate }) {
  const [activeGymDay, setActiveGymDay] = useState('gym1');
  const [editingDayName, setEditingDayName] = useState(null);
  const currentGymPlan = DEFAULT_GYM_PLAN.find(g => g.id === activeGymDay);
  const currentDayState = (gymWorkout.days && gymWorkout.days[activeGymDay]) || makeGymDayState(currentGymPlan);

  const dayNames = gymWorkout.dayNames || {};
  const getDayName = (id) => dayNames[id] || DEFAULT_GYM_PLAN.find(g => g.id === id)?.day || id;

  const updateDay = (updater) => {
    onUpdate(prev => {
      const days = prev.days || {};
      const day = days[activeGymDay] || makeGymDayState(currentGymPlan);
      return { ...prev, days: { ...days, [activeGymDay]: updater(day) } };
    });
  };

  const setDayName = (id, name) => {
    onUpdate(prev => ({
      ...prev,
      dayNames: { ...(prev.dayNames || {}), [id]: name }
    }));
  };

  const toggleCalendarDate = (dateStr) => {
    onUpdate(prev => {
      const cal = { ...(prev.calendar || {}) };
      if (cal[dateStr]) {
        delete cal[dateStr];
      } else {
        // Cycle through gym days: assign the active gym day
        cal[dateStr] = { gymDayId: activeGymDay, timestamp: Date.now() };
      }
      return { ...prev, calendar: cal };
    });
  };

  const toggleEx = (i) => updateDay(d => {
    const exercises = [...d.exercises];
    exercises[i] = { ...exercises[i], checked: !exercises[i].checked };
    return { ...d, exercises };
  });
  const toggleCore = (i) => updateDay(d => {
    const coreExercises = [...d.coreExercises];
    coreExercises[i] = { ...coreExercises[i], checked: !coreExercises[i].checked };
    return { ...d, coreExercises };
  });
  const toggleCardio = (which) => updateDay(d => ({
    ...d, [which]: d[which] ? { ...d[which], checked: !d[which].checked } : d[which]
  }));
  const updateEx = (i, field, val) => updateDay(d => {
    const exercises = [...d.exercises];
    exercises[i] = { ...exercises[i], [field]: val };
    return { ...d, exercises };
  });
  const updateCore = (i, field, val) => updateDay(d => {
    const coreExercises = [...d.coreExercises];
    coreExercises[i] = { ...coreExercises[i], [field]: val };
    return { ...d, coreExercises };
  });
  const updateCardio = (which, field, val) => updateDay(d => ({
    ...d, [which]: d[which] ? { ...d[which], [field]: val } : d[which]
  }));
  const updateCardioDetail = (which, val) => updateDay(d => ({
    ...d, [which]: d[which] ? { ...d[which], detail: val } : d[which]
  }));
  const updateMaxWeight = (type, i, val) => updateDay(d => {
    const arr = [...d[type]];
    arr[i] = { ...arr[i], maxWeight: val };
    return { ...d, [type]: arr };
  });
  const addEx = () => updateDay(d => ({
    ...d, exercises: [...d.exercises, { id: `g_${Date.now()}`, name: 'New Exercise', detail: '3 × 10 reps', icon: '🏋️', maxWeight: '', checked: false }]
  }));
  const addCore = () => updateDay(d => ({
    ...d, coreExercises: [...d.coreExercises, { id: `gc_${Date.now()}`, name: 'Core Exercise', detail: '3 × 15 reps', icon: '🌀', maxWeight: '', checked: false }]
  }));
  const removeEx = (i) => updateDay(d => ({ ...d, exercises: d.exercises.filter((_, idx) => idx !== i) }));
  const removeCore = (i) => updateDay(d => ({ ...d, coreExercises: d.coreExercises.filter((_, idx) => idx !== i) }));
  const setNote = (note) => updateDay(d => ({ ...d, note }));

  return (
    <div className="slide-in">
      {/* Section Header */}
      <div className="flex items-center gap-3 mb-5">
        <div className="w-10 h-10 rounded-xl flex items-center justify-center text-2xl" style={{background:'linear-gradient(135deg,#e63946,#ff6b35)'}}>🏋️</div>
        <div>
          <h2 className="bebas text-3xl text-white leading-none">General Workout</h2>
          <p className="text-xs text-gray-500 mt-0.5">4-Day Body Part Split · Tap day names to rename · Auto-saved</p>
        </div>
      </div>

      {/* Calendar */}
      <WorkoutCalendar
        calendar={gymWorkout.calendar || {}}
        onToggleDate={toggleCalendarDate}
        gymWorkout={gymWorkout}
      />

      {/* Tip */}
      <div className="bg-white/3 border border-gray-800 rounded-xl px-4 py-3 mb-5 text-xs text-gray-400 flex items-start gap-2">
        <span>💡</span>
        <span>Tap day names below to rename them. Tap exercises to edit. Use the calendar above to track workout days.</span>
      </div>

      {/* Day Tabs with editable names */}
      <div className="grid grid-cols-4 gap-2 mb-5">
        {DEFAULT_GYM_PLAN.map(gd => {
          const ds = gymWorkout.days?.[gd.id];
          const total = ds ? ds.exercises.length + ds.coreExercises.length + (ds.cardioStart ? 1 : 0) + (ds.cardioEnd ? 1 : 0) : 0;
          const done = ds ? ds.exercises.filter(e => e.checked).length + ds.coreExercises.filter(e => e.checked).length + (ds.cardioStart?.checked ? 1 : 0) + (ds.cardioEnd?.checked ? 1 : 0) : 0;
          const pct = total > 0 ? Math.round((done / total) * 100) : 0;
          const isActive = activeGymDay === gd.id;
          const displayName = getDayName(gd.id);
          const isEditing = editingDayName === gd.id;
          return (
            <div key={gd.id} className="flex flex-col">
              <button onClick={() => setActiveGymDay(gd.id)}
                className={`flex flex-col items-center px-2 py-2.5 rounded-xl border text-xs font-semibold transition-all ${isActive ? 'tab-active border-transparent text-white shadow-lg glow-red' : 'border-gray-800 text-gray-400 hover:border-gray-600 hover:text-gray-200'}`}>
                <span className="text-base mb-0.5">{gd.emoji}</span>
                {isEditing ? (
                  <input type="text" className="w-full bg-transparent text-center text-xs font-bold text-white outline-none border-b border-red-500"
                    autoFocus defaultValue={displayName}
                    onClick={e => e.stopPropagation()}
                    onBlur={e => { setDayName(gd.id, e.target.value || gd.day); setEditingDayName(null); }}
                    onKeyDown={e => { if (e.key === 'Enter') { setDayName(gd.id, e.target.value || gd.day); setEditingDayName(null); } }} />
                ) : (
                  <span className="bebas text-sm leading-none cursor-pointer hover:text-red-300"
                    onClick={e => { e.stopPropagation(); setEditingDayName(gd.id); }}
                    title="Tap to rename">{displayName}</span>
                )}
                <span className="text-xs mt-0.5" style={{color: isActive ? 'rgba(255,255,255,0.7)' : pct === 100 ? '#4ade80' : '#555'}}>
                  {pct === 100 ? '✅' : `${pct}%`}
                </span>
              </button>
            </div>
          );
        })}
      </div>

      {/* Active Day Card */}
      <div key={activeGymDay} className="bg-white/3 border border-gray-800 rounded-2xl p-5">
        <GymDayCard
          gymDay={{...currentGymPlan, day: getDayName(currentGymPlan.id)}}
          dayState={currentDayState}
          onToggleEx={toggleEx}
          onToggleCore={toggleCore}
          onToggleCardio={toggleCardio}
          onUpdateEx={updateEx}
          onUpdateCore={updateCore}
          onUpdateCardio={updateCardio}
          onUpdateDetail={updateCardioDetail}
          onUpdateMax={updateMaxWeight}
          onAddEx={addEx}
          onAddCore={addCore}
          onRemoveEx={removeEx}
          onRemoveCore={removeCore}
          onNote={setNote}
        />
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [activeDay, setActiveDay] = useState(1);
  const [activeSection, setActiveSection] = useState('battle'); // 'battle' | 'gym'
  const [user, setUser] = useState(null);
  const [dbState, setDbState] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState('');
  const [view, setView] = useState('login'); // 'login' | 'dashboard' | 'leaderboard'
  const saveTimer = useRef(null);
  const timeLeft = useCountdown();

  // Check for existing session on mount
  useEffect(() => {
    const saved = sessionStorage.getItem(SESSION_KEY);
    if (saved) {
      setUser(saved);
      setView('loading');
      loginUser(saved).then(result => {
        setDbState({ id: result.blobId, data: result.data });
        setView('dashboard');
      }).catch(() => {
        sessionStorage.removeItem(SESSION_KEY);
        setUser(null);
        setView('login');
      });
    }
  }, []);

  const handleLogin = (username, result) => {
    setUser(username);
    setDbState({ id: result.blobId, data: result.data });
    setView('dashboard');
  };

  const handleLogout = () => {
    sessionStorage.removeItem(SESSION_KEY);
    setUser(null);
    setDbState(null);
    setView('login');
  };

  const scheduleSave = useCallback((newData, id) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      setSyncing(true);
      try {
        await saveBlob(id, { ...newData, lastSeen: Date.now() });
        setSyncMsg('Saved ✓');
      } catch (_) {
        setSyncMsg('Offline');
      }
      setSyncing(false);
      setTimeout(() => setSyncMsg(''), 2000);
    }, 800);
  }, []);

  const updateData = useCallback((updater) => {
    setDbState(prev => {
      if (!prev) return prev;
      const newData = updater(prev.data);
      scheduleSave(newData, prev.id);
      return { ...prev, data: newData };
    });
  }, [scheduleSave]);

  const toggleExercise = useCallback((dayNum, exId) => {
    updateData(data => ({
      ...data,
      progress: {
        ...data.progress,
        [`day${dayNum}`]: {
          ...data.progress[`day${dayNum}`],
          checked: {
            ...data.progress[`day${dayNum}`]?.checked,
            [exId]: !data.progress[`day${dayNum}`]?.checked?.[exId]
          }
        }
      }
    }));
  }, [updateData]);

  const updateNote = useCallback((dayNum, note) => {
    updateData(data => ({
      ...data,
      progress: { ...data.progress, [`day${dayNum}`]: { ...data.progress[`day${dayNum}`], note } }
    }));
  }, [updateData]);

  const toggleGear = useCallback((gid) => {
    updateData(data => ({ ...data, gear: { ...data.gear, [gid]: !data.gear[gid] } }));
  }, [updateData]);

  const updateGymWorkout = useCallback((updater) => {
    updateData(data => ({
      ...data,
      gymWorkout: updater(data.gymWorkout || makeGymInitialState())
    }));
  }, [updateData]);

  // Loading state
  if (view === 'loading') {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-4xl mb-4 flame">🔥</div>
          <div className="text-gray-400 text-sm">Loading {user}'s battle plan...</div>
        </div>
      </div>
    );
  }

  // Login
  if (view === 'login') {
    return <LoginScreen onLogin={handleLogin} onLeaderboard={() => setView('leaderboard')} />;
  }

  // Leaderboard (accessible both logged in and out)
  if (view === 'leaderboard') {
    return <LeaderboardScreen currentUser={user} onBack={() => setView(user && dbState ? 'dashboard' : 'login')} />;
  }

  // Dashboard guard
  if (!dbState) {
    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="text-center">
          <div className="text-4xl mb-4 flame">🔥</div>
          <div className="text-gray-400 text-sm">Loading...</div>
        </div>
      </div>
    );
  }

  const { data } = dbState;
  const currentPlan = PLAN.find(p => p.day === activeDay);

  const dayPcts = {};
  PLAN.forEach(p => {
    const prog = data.progress[`day${p.day}`] || {};
    const done = Object.values(prog.checked || {}).filter(Boolean).length;
    dayPcts[p.day] = p.exercises.length > 0 ? Math.round((done / p.exercises.length) * 100) : 0;
  });

  const raceToday = new Date() >= RACE_DATE;

  return (
    <div className="min-h-screen max-w-2xl mx-auto px-4 py-6">

      {/* Header */}
      <div className="text-center mb-6">
        {/* User bar */}
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2 bg-white/5 border border-gray-800 rounded-full px-3 py-1.5">
            <span className="w-2 h-2 bg-green-500 rounded-full inline-block"></span>
            <span className="text-xs text-gray-300 font-semibold capitalize">{user}</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setView('leaderboard')}
              className="text-xs text-gray-400 hover:text-white border border-gray-800 hover:border-gray-600 rounded-full px-3 py-1.5 transition-colors flex items-center gap-1">
              🏆 Leaderboard
            </button>
            <button onClick={handleLogout}
              className="text-xs text-gray-600 hover:text-gray-300 border border-gray-800 hover:border-gray-600 rounded-full px-3 py-1.5 transition-colors">
              Switch ↗
            </button>
          </div>
        </div>

        <div className="inline-flex items-center gap-2 bg-red-950/50 border border-red-900/50 rounded-full px-4 py-1.5 mb-3">
          <span className="w-2 h-2 bg-red-500 rounded-full pulse-red inline-block"></span>
          <span className="text-xs text-red-400 uppercase tracking-widest font-semibold">Delhi — Mar 15, 2026</span>
        </div>
        <h1 className="bebas text-5xl sm:text-6xl leading-none text-white tracking-wide">
          Devil <span style={{color:'#e63946'}}>Circuit</span>
        </h1>
        <p className="text-gray-500 text-sm mt-2 tracking-wider">6-Day Battle Plan · Conquer Every Obstacle</p>
      </div>

      {/* Countdown */}
      {!raceToday ? (
        <div className="bg-white/3 border border-gray-800 rounded-2xl p-5 mb-6">
          <div className="text-xs text-gray-600 uppercase tracking-widest text-center mb-3">Time Until Race</div>
          <div className="flex items-center justify-center gap-6">
            <CountdownUnit val={timeLeft.d} label="days" />
            <span className="text-gray-700 text-2xl bebas">:</span>
            <CountdownUnit val={timeLeft.h} label="hrs" />
            <span className="text-gray-700 text-2xl bebas">:</span>
            <CountdownUnit val={timeLeft.m} label="min" />
            <span className="text-gray-700 text-2xl bebas">:</span>
            <CountdownUnit val={timeLeft.s} label="sec" />
          </div>
        </div>
      ) : (
        <div className="race-day-card rounded-2xl p-5 mb-6 text-center">
          <div className="bebas text-4xl">🔥 RACE DAY! GO CRUSH IT! 🔥</div>
        </div>
      )}

      {/* Section Switcher */}
      <div className="flex gap-2 mb-6 bg-white/3 border border-gray-800 rounded-2xl p-1.5">
        <button onClick={() => setActiveSection('battle')}
          className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold transition-all ${activeSection === 'battle' ? 'tab-active text-white shadow-lg' : 'text-gray-500 hover:text-gray-300'}`}>
          <span>🔥</span> Battle Plan
        </button>
        <button onClick={() => setActiveSection('gym')}
          className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-semibold transition-all ${activeSection === 'gym' ? 'tab-active text-white shadow-lg' : 'text-gray-500 hover:text-gray-300'}`}>
          <span>🏋️</span> General Workout
        </button>
      </div>

      {/* ── Battle Plan Section ── */}
      {activeSection === 'battle' && (
        <>
          {/* Overall progress */}
          <div className="mb-6">
            <OverallProgress progress={data.progress} />
          </div>

          {/* Day tabs */}
          <div className="grid grid-cols-6 gap-2 mb-6">
            {PLAN.map(p => (
              <DayTab key={p.day} plan={p} active={activeDay === p.day}
                completed={dayPcts[p.day]}
                onClick={() => setActiveDay(p.day)} />
            ))}
          </div>

          {/* Day card */}
          <div key={activeDay} className="bg-white/3 border border-gray-800 rounded-2xl p-5 mb-2">
            <DayCard
              plan={currentPlan}
              dayProgress={data.progress[`day${activeDay}`] || { checked: {}, note: '' }}
              onToggle={(exId) => toggleExercise(activeDay, exId)}
              onNote={(note) => updateNote(activeDay, note)}
            />
          </div>

          {/* Gear checklist */}
          <GearChecklist gear={data.gear} onToggle={toggleGear} />

          {/* Race morning protocol */}
          <RaceMorningCard />
        </>
      )}

      {/* ── General Workout Section ── */}
      {activeSection === 'gym' && (
        <GeneralWorkoutSection
          gymWorkout={data.gymWorkout || makeGymInitialState()}
          onUpdate={updateGymWorkout}
        />
      )}

      {/* Sync indicator */}
      <div className="text-right text-xs mt-4 mb-4 h-4">
        {syncing && <span className="text-yellow-500">⟳ Syncing...</span>}
        {syncMsg && !syncing && <span className="text-green-500">{syncMsg}</span>}
        {dbState.id && !syncing && !syncMsg && (
          <span className="text-gray-700">☁ Cloud synced · ID: {dbState.id.slice(0,8)}...</span>
        )}
      </div>

      {/* Footer */}
      <div className="text-center mt-4 pb-4 text-gray-700 text-xs">
        <p>Progress saved to JSONBlob cloud · Auto-synced across devices</p>
        <p className="mt-1 bebas text-sm text-gray-600">Devil Circuit Delhi 2026 · Train Hard, Run Harder 🔥</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
